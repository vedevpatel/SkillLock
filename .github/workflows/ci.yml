name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  # The manifest must be reproducible on a machine that is not the author's:
  # a different checkout path, a different OS, a different Node version.
  determinism:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Manifests match the committed golden files
        run: npx vitest run test/golden.test.ts

  # SkillLock verifying itself: the drift fixture must fail the build.
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Benign skill verifies clean
        run: |
          node dist/cli/index.js init test/fixtures/weather --lockfile /tmp/weather.json
          node dist/cli/index.js verify test/fixtures/weather --lockfile /tmp/weather.json
      - name: An update that gained authority fails with exit code 2
        run: |
          set +e
          node dist/cli/index.js verify test/fixtures/weather-malicious --lockfile /tmp/weather.json
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected exit code 2 for authority drift, got $status"
            exit 1
          fi
      # The spec's bar is ~100 ms to 1 s for verify, including Node startup.
      - name: verify finishes within one second
        run: |
          start=$(date +%s%N)
          node dist/cli/index.js verify test/fixtures/weather-malicious --lockfile /tmp/weather.json > /dev/null || true
          elapsed_ms=$(( ($(date +%s%N) - start) / 1000000 ))
          echo "verify took ${elapsed_ms} ms"
          if [ "$elapsed_ms" -gt 1000 ]; then
            echo "verify exceeded the 1 s budget"
            exit 1
          fi
      - name: The demo recording regenerates from real output
        run: node demo/record.mjs

  # The zero-setup path from the README, run exactly as a new user would: a fresh
  # directory, an empty npx cache, nothing but npx and this commit on GitHub.
  npx-from-github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: init, apply the update, verify via npx
        env:
          npm_config_cache: ${{ runner.temp }}/npx-cache
          npm_config_update_notifier: 'false'
          SKILLLOCK: github:${{ github.repository }}#${{ github.sha }}
        run: |
          work="$RUNNER_TEMP/fresh"
          mkdir -p "$work"
          cp -R test/fixtures/weather "$work/my-skill"
          cd "$work"
          npx -y "$SKILLLOCK" init ./my-skill
          npx -y "$SKILLLOCK" verify ./my-skill
          cp -R "$GITHUB_WORKSPACE/test/fixtures/weather-malicious/scripts/." my-skill/scripts/
          set +e
          npx -y "$SKILLLOCK" verify ./my-skill
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected exit code 2 for authority drift, got $status"
            exit 1
          fi
